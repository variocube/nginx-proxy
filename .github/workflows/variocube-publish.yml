name: Variocube publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 1.11.6-12-gbff2cdd-nginx1.31.9"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/variocube/nginx-proxy

jobs:
  publish:
    if: github.ref == 'refs/heads/variocube'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag
        run: |
          if ! printf '%s' "$TAG_INPUT" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::invalid tag"
            exit 1
          fi
        env:
          TAG_INPUT: ${{ inputs.tag }}

      - name: Compute version
        run: |
          version="$(git describe --tags 2>/dev/null || true)"
          if [ -z "$version" ]; then
            version="${TAG_INPUT}"
          fi
          echo "NGINX_PROXY_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"
        env:
          TAG_INPUT: ${{ inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/amd64
          load: true
          push: false
          tags: nginx-proxy:smoke
          build-args: |
            NGINX_PROXY_VERSION=${{ env.NGINX_PROXY_VERSION }}

      - name: Smoke test
        run: |
          set -euo pipefail
          expected="$(sed -n 's|^FROM docker.io/library/nginx:\([^ ]*\).*|\1|p' Dockerfile.debian | head -n1)"
          test -n "$expected"
          echo "NGINX_VERSION=$expected" >> "$GITHUB_ENV"
          actual="$(docker run --rm nginx-proxy:smoke nginx -v 2>&1)"
          echo "$actual"
          [ "$actual" = "nginx version: nginx/$expected" ] \
            || { echo "::error::expected nginx version: nginx/$expected"; exit 1; }

          cid="$(docker run -d -v /var/run/docker.sock:/tmp/docker.sock:ro -p 8080:80 nginx-proxy:smoke)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          code=""
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' localhost:8080 || true)"
            [ "$code" = "503" ] && break
            sleep 1
          done
          if [ "$code" != "503" ]; then
            echo "::error::expected HTTP 503, got '$code'"
            docker logs "$cid"
            exit 1
          fi
          docker exec "$cid" nginx -t || { docker logs "$cid"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          build-args: |
            NGINX_PROXY_VERSION=${{ env.NGINX_PROXY_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/variocube/nginx-proxy
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify pushed image
        run: |
          set -euo pipefail
          for p in linux/amd64 linux/arm64; do
            actual="$(docker run --rm --pull always --platform "$p" "${IMAGE}@${DIGEST}" nginx -v 2>&1)"
            echo "$p: $actual"
            [ "$actual" = "nginx version: nginx/${NGINX_VERSION}" ] \
              || { echo "::error::$p: expected nginx version: nginx/${NGINX_VERSION}"; exit 1; }
            echo "$p uname -m: $(docker run --rm --platform "$p" "${IMAGE}@${DIGEST}" uname -m)"
          done
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Summary
        run: |
          {
            echo "### Published"
            echo "- Image: \`${IMAGE}:${TAG_INPUT}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- nginx: \`${NGINX_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG_INPUT: ${{ inputs.tag }}
